aml_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      user: app_dbt
      password: "{{ env_var('APP_DBT_DB_PASSWORD') }}"
      dbname: aml_platform
      schema: analytics
      threads: 4
      timeout_seconds: 300