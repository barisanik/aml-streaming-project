name: 'aml_platform'
version: '1.0.0'
profile: 'aml_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
vars:
  lookback_mins: 15
  scenario_grace_mins: 5   # a scenario counts towards recall only after its last injection is this old

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  aml_platform:
    staging:
      +materialized: incremental
    intermediate:
      +materialized: table
    marts:
      +materialized: table
      +grants:
        select: ['app_grafana']   # Grafana reads only aggregated marts, never row level answer key data